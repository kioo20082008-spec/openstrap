# Runs the measurement unit tests (sleep, HRV, recovery, steps, load, calories) on the redesign branches.
name: Tests

on:
  push:
    branches: ["design/**"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;36.0.0" > /dev/null
      - name: Measurement tests
        run: ./gradlew :app:testDebugUnitTest --tests 'org.openstrap.app.data.*' --continue
      - name: Failed tests
        if: failure()
        run: |
          grep -l "<failure" app/build/test-results/testDebugUnitTest/*.xml | while read f; do
            python3 - "$f" <<'EOF'
          import sys, xml.etree.ElementTree as E
          for c in E.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in c.findall("failure"):
                  print("FAIL", c.get("classname"), c.get("name"), "::", (f.get("message") or "")[:300])
          EOF
          done
